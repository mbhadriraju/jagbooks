[project]
name = "bvw-debate-finance-api"
version = "1.0.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "python-dotenv>=1.0,<2",
  "structlog>=26.1,<27",
  "pymupdf==1.26.7",
  "openpyxl==3.1.5",
  "groq>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx2>=2.13.1,<3"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.vercel.scripts]
build = "python -m scripts.deploy_setup"
